name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run export:web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npx --yes deno check supabase/functions/delete-account/index.ts
      - run: npm run export:native -- --output-dir dist-native
      - name: Verify Galaxy configuration and native export
        env:
          EXPO_PUBLIC_ANDROID_STORE: galaxy
        run: npx expo export --platform android --output-dir dist-galaxy
      - uses: actions/upload-artifact@v4
        with:
          name: javascript-exports-not-store-builds
          path: |
            dist
            dist-native
            dist-galaxy
          retention-days: 7
